name: Update GitHub IP List for MikroTik

# run daily and on manual trigger
on:
  schedule:
    - cron: '0 0 * * *'   # every day at midnight UTC
  workflow_dispatch:      # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch GitHub meta JSON
        run: curl -s https://api.github.com/meta -o github-meta.json

      - name: Build MikroTik .rsc script
        run: |
          OUT=github-ip-list.rsc
          echo "# Auto‑generated MikroTik address list – GitHub IPs" > $OUT
          echo "/ip firewall address-list"   >> $OUT

          # combine all arrays, dedupe and sort
          jq -r '
            [
              .web,
              .api,
              .git,
              .hooks,
              .packages,
              .pages,
              .actions
            ] 
            | add 
            | unique[]
          ' github-meta.json | sort |
          while read CIDR; do
            echo "add address=${CIDR} list=GitHub" >> $OUT
          done

      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-ip-list.rsc
          git diff --quiet || git commit -m "chore: update GitHub IP list for MikroTik"
          git push
