name: Update GitHub IP List for MikroTik

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Localhost branch (full clone + creds)
        uses: actions/checkout@v3
        with:
          ref: Localhost
          fetch-depth: 0
          persist-credentials: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch GitHub meta JSON
        run: curl -s https://api.github.com/meta -o github-meta.json

      - name: Build MikroTik .rsc script
        run: |
          OUT=github-ip-list.rsc
          echo "# Auto‑generated MikroTik address list – GitHub IPs" > $OUT
          echo "/ip firewall address-list"         >> $OUT

          jq -r '
            [
              .web,
              .api,
              .git,
              .hooks,
              .packages,
              .pages,
              .actions
            ]
            | add
            | unique[]
          ' github-meta.json | sort |
          while read CIDR; do
            echo "add address=${CIDR} list=GitHub" >> $OUT
          done

      - name: Debug: show generated file
        run: |
          echo "—— Directory listing ——"
          ls -al .
          echo ""
          echo "—— Content of github-ip-list.rsc ——"
          cat github-ip-list.rsc

      - name: Commit & push changes to Localhost
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-ip-list.rsc
          git diff --cached --exit-code || git commit -m "chore: update GitHub IP list for MikroTik"
          git push origin Localhost
